name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FINOVATECH_PROD_HOST }}
          username: ${{ secrets.FINOVATECH_PROD_USER }}
          key: ${{ secrets.FINOVATECH_PROD_SSH_KEY }}
          script: bash /home/sites/finovatech-deploy.sh
